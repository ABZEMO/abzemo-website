  <style>
    :root {
      --blue: #1264d8;
      --blue-dark: #084a9e;
      --navy: #071a35;
      --text: #24344d;
      --muted: #6f7f95;
      --light: #f5f8fc;
      --white: #fff;
      --line: #dce5f0;
      --shadow: 0 22px 65px rgba(7, 26, 53, .10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    body.menu-open { overflow: hidden; }

    a {
      color: inherit;
      text-decoration: none;
    }

    button { font: inherit; }

    .container {
      width: min(1180px, calc(100% - 48px));
      margin-inline: auto;
    }

    /* HEADER */

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 1000;
      min-height: 78px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(220,229,240,.85);
    }

    .navbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: var(--navy);
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1.8px;
    }

    .brand span { color: var(--blue); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
      transition: color .2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--blue);
    }

    .nav-button {
      padding: 11px 18px;
      color: #fff !important;
      background: var(--navy);
      border-radius: 9px;
    }

    .nav-button:hover { background: var(--blue); }

    .menu-button {
      width: 46px;
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(7,26,53,.06);
    }

    .menu-button span {
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background: var(--navy);
    }

    /* MENU */

    .mega-overlay {
      position: fixed;
      inset: 0;
      z-index: 1090;
      background: rgba(7,26,53,.42);
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: .3s ease;
    }

    .mega-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .mega-menu {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 1100;
      width: min(460px, 88vw);
      overflow-y: auto;
      background: #fff;
      transform: translateX(-105%);
      transition: transform .38s cubic-bezier(.77,0,.18,1);
      box-shadow: 20px 0 70px rgba(7,26,53,.2);
    }

    .mega-menu.active { transform: translateX(0); }

    .mega-top {
      min-height: 82px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .mega-brand {
      color: var(--navy);
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .mega-brand span { color: var(--blue); }

    .mega-close {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--navy);
      font-size: 27px;
      cursor: pointer;
    }

    .mega-content { padding: 30px 28px 42px; }

    .mega-section { margin-bottom: 32px; }

    .mega-section:last-child { margin-bottom: 0; }

    .mega-section-title {
      margin-bottom: 12px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .mega-section a {
      display: block;
      padding: 7px 0;
      color: var(--navy);
      font-size: 15px;
      font-weight: 700;
      transition: .2s ease;
    }

    .mega-section a:hover {
      color: var(--blue);
      transform: translateX(4px);
    }

    .mega-section .sub-link {
      padding-left: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* HERO */

    .page-hero {
      min-height: 72vh;
      padding-top: 78px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 40%, rgba(18,100,216,.13), transparent 30%),
        linear-gradient(135deg, #fff 0%, #f5f8fc 100%);
    }

    .page-hero::after {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      right: -150px;
      bottom: -190px;
      border: 1px solid rgba(18,100,216,.14);
      border-radius: 50%;
      box-shadow:
        0 0 0 55px rgba(18,100,216,.035),
        0 0 0 110px rgba(18,100,216,.025);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 850px;
      padding: 100px 0;
    }

    .hero-label,
    .section-label {
      margin-bottom: 15px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .page-hero h1 {
      max-width: 850px;
      margin: 0 0 25px;
      color: var(--navy);
      font-size: clamp(52px, 7vw, 88px);
      line-height: .98;
      letter-spacing: -4px;
    }

    .page-hero p {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.8;
    }

    /* SECTIONS */

    .section {
      padding: 115px 0;
    }

    .section-light { background: var(--light); }

    .section-header {
      max-width: 760px;
      margin-bottom: 52px;
    }

    .section h2 {
      margin: 0 0 20px;
      color: var(--navy);
      font-size: clamp(38px, 5vw, 66px);
      line-height: 1.02;
      letter-spacing: -3px;
    }

    .section-header p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .two-column {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 80px;
      align-items: start;
    }

    .two-column > div > p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.85;
    }

    .two-column > div > p:last-child {
      margin-bottom: 0;
    }

    /* CONTACT DETAILS */

    .contact-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .contact-item {
      min-height: 165px;
      padding: 28px;
      border: 1px solid var(--line);
      background: #fff;
      transition: .25s ease;
    }

    .contact-item:hover {
      border-color: rgba(18,100,216,.4);
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .contact-item h3 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 18px;
    }

    .contact-item p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .contact-item a {
      color: var(--blue);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .contact-item a:hover {
      color: var(--blue-dark);
    }

    /* DISCUSSION CARDS */

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .card {
      min-height: 245px;
      padding: 30px;
      border: 1px solid var(--line);
      background: #fff;
      transition: .25s ease;
    }

    .card:hover {
      border-color: rgba(18,100,216,.4);
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(18,100,216,.2);
      border-radius: 10px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
    }

    .card h3 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 20px;
      line-height: 1.25;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    /* NEXT STEPS */

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .step {
      padding: 32px;
      border-top: 3px solid var(--blue);
      background: var(--light);
    }

    .step-number {
      display: block;
      margin-bottom: 28px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .step span {
      display: block;
      color: var(--navy);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.65;
    }

    /* CTA */

    .cta-section {
      padding: 105px 0;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    }

    .cta-section .section-label { color: #9fc4ff; }

    .cta-section h2 { color: #fff; }

    .cta-section p {
      max-width: 680px;
      color: rgba(255,255,255,.76);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 22px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 800;
      transition: .25s ease;
    }

    .btn-primary {
      color: #fff;
      background: var(--blue);
    }

    .btn-primary:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
    }

    .cta-section .btn-primary {
      margin-top: 8px;
      color: var(--blue);
      background: #fff;
    }

    /* FOOTER */

    .site-footer {
      padding: 65px 0 25px;
      color: #fff;
      background: #041225;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      gap: 50px;
      padding-bottom: 45px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .footer-brand { max-width: 420px; }

    .footer-logo {
      margin-bottom: 15px;
      color: #fff;
      font-size: 29px;
      font-weight: 900;
    }

    .footer-logo span { color: #5c9cff; }

    .footer-brand p {
      margin: 0;
      color: rgba(255,255,255,.55);
      line-height: 1.8;
    }

    .footer-links {
      display: flex;
      gap: 70px;
    }

    .footer-column h4 {
      margin: 0 0 16px;
      color: rgba(255,255,255,.75);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .footer-column a {
      display: block;
      margin-bottom: 9px;
      color: rgba(255,255,255,.55);
      font-size: 13px;
    }

    .footer-column a:hover { color: #fff; }

    .footer-bottom {
      padding-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255,255,255,.38);
      font-size: 11px;
    }

    /* RESPONSIVE */

    @media (max-width: 980px) {
      .nav-links { display: none; }

      .two-column {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .card-grid,
      .steps {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer-top {
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 32px, 1180px);
      }

      .navbar {
        min-height: 70px;
      }

      .page-hero {
        padding-top: 70px;
        min-height: auto;
      }

      .hero-content {
        padding: 80px 0;
      }

      .page-hero h1 {
        font-size: clamp(48px, 14vw, 70px);
        letter-spacing: -3px;
      }

      .page-hero p {
        font-size: 16px;
      }

      .section {
        padding: 80px 0;
      }

      .section h2 {
        letter-spacing: -2px;
      }

      .contact-details,
      .card-grid,
      .steps {
        grid-template-columns: 1fr;
      }

      .footer-links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }

  <script>
    const menuButton = document.getElementById("menuButton");
    const megaMenu = document.getElementById("megaMenu");
    const megaOverlay = document.getElementById("megaOverlay");
    const megaClose = document.getElementById("megaClose");

    function openMegaMenu() {
      megaMenu.classList.add("active");
      megaOverlay.classList.add("active");
      document.body.classList.add("menu-open");
      menuButton.setAttribute("aria-expanded", "true");
    }

    function closeMegaMenu() {
      megaMenu.classList.remove("active");
      megaOverlay.classList.remove("active");
      document.body.classList.remove("menu-open");
      menuButton.setAttribute("aria-expanded", "false");
    }

    menuButton.addEventListener("click", openMegaMenu);
    megaClose.addEventListener("click", closeMegaMenu);
    megaOverlay.addEventListener("click", closeMegaMenu);

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeMegaMenu();
      }
    });

    megaMenu.querySelectorAll("a").forEach(function(link) {
      link.addEventListener("click", closeMegaMenu);
    });
  </script>
