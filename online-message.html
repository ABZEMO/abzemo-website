<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Online Message | ABZEMO</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="abzemo-contact.css"><style>.site-header{position:fixed;top:0;left:0;right:0;z-index:9980}</style><style>.msg-page{min-height:100vh;padding:150px 24px 90px;background:linear-gradient(135deg,#fff,#f5f8fc)}.msg-wrap{width:min(900px,100%);margin:auto}.msg-wrap h1{margin:0 0 18px;color:#071a35;font-size:clamp(38px,5vw,66px);line-height:1;letter-spacing:-3px}.msg-wrap>p{color:#6f7f95;font-size:18px;line-height:1.8}.msg-form{margin-top:40px;padding:32px;border:1px solid #dce5f0;background:#fff;display:grid;gap:16px}.msg-form label{color:#071a35;font-size:13px;font-weight:700}.msg-form input,.msg-form textarea{width:100%;margin-top:7px;padding:13px 14px;border:1px solid #dce5f0;border-radius:8px;outline:none}.msg-form textarea{min-height:170px;resize:vertical}.msg-form button{width:max-content;padding:13px 22px;border:0;border-radius:9px;background:#1264d8;color:#fff;font-weight:800;cursor:pointer}</style></head><body><main class="msg-page"><div class="msg-wrap"><div class="section-label">Online Message</div><h1>Tell us what you need.</h1><p>Send ABZEMO a message and our team can review your enquiry.</p><form class="msg-form" action="mailto:info@abzemo.com" method="post" enctype="text/plain"><label>Name<input name="Name" required></label><label>Email<input name="Email" type="email" required></label><label>Phone<input name="Phone" type="tel"></label><label>Message<textarea name="Message" required></textarea></label><button type="submit">Submit Message</button></form></div></main><script src="abzemo-contact.js"></script></body></html>
