name: UZMO Memory Tests

on:
  push:
    paths:
      - "uzmo/memory/**"
      - "test/uzmo-memory.test.mjs"
      - "package.json"
  pull_request:
    paths:
      - "uzmo/memory/**"
      - "test/uzmo-memory.test.mjs"
      - "package.json"

jobs:
  memory-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:uzmo-memory
