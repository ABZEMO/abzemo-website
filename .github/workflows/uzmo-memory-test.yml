name: UZMO Tests

on:
  push:
    paths:
      - "uzmo/**"
      - "test/uzmo-*.test.mjs"
      - "package.json"
  pull_request:
    paths:
      - "uzmo/**"
      - "test/uzmo-*.test.mjs"
      - "package.json"

jobs:
  uzmo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:uzmo
