<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>UZMO Zoho Test</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    pre { background: #f3f3f3; padding: 10px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h3>UZMO Zoho Lead Test</h3>
  <input id="key" type="password" placeholder="UZMO_ZOHO_LEAD_KEY">
  <input id="name" placeholder="Last name (zaroori)" value="Test Lead">
  <input id="email" placeholder="Email" value="test@example.com">
  <input id="phone" placeholder="Phone">
  <button id="go">Zoho mein lead banao</button>
  <pre id="out">Result yahan dikhega</pre>
  <script>
    document.getElementById("go").onclick = async function () {
      var out = document.getElementById("out");
      out.textContent = "Bhej raha hun...";
      try {
        var r = await fetch("/api/zoho-lead", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-uzmo-key": document.getElementById("key").value.trim()
          },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            source: "UZMO Test"
          })
        });
        out.textContent = r.status + "\n" + (await r.text());
      } catch (e) {
        out.textContent = "Error: " + e.message;
      }
    };
  </script>
</body>
</html>
